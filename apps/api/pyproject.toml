[project]
name = "blog-ai-api"
version = "0.1.0"
description = "Blog AI FastAPI backend"
requires-python = ">=3.12,<3.14"
# Keep in sync with requirements.txt. Vercel's Python runtime resolves this table with uv.
dependencies = [
    "tenacity>=9.1.4",
    "openai>=2.15.0",
    "anthropic>=0.76.0",
    "requests>=2.31.0",
    "pydantic>=2.5.2,<3.0.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "Pillow>=12.1.1",
    "starlette>=0.47.2",
    "protobuf>=5.29.6",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "websockets>=12.0",
    "python-multipart>=0.0.31",
    "uvloop>=0.19.0; platform_system != 'Windows'",
    "asyncpg>=0.29.0",
    "bcrypt>=4.0.0,<5.0.0",
    "nh3>=0.2.14",
    "python3-saml>=1.16.0",
    "authlib>=1.7.2",
    "httpx>=0.27.0,<1.0.0",
    "PyJWT>=2.13.0",
    "cryptography>=50.0.0,<51.0.0",
    "redis>=5.0.0",
    "stripe>=7.0.0",
    "sentry-sdk[fastapi]>=1.40.0",
]

[dependency-groups]
# Dev tooling. CI installs these by name today (pytest/pytest-asyncio/pytest-cov);
# declaring them here is what makes `uv sync` reproduce a working test env.
dev = [
    "pytest>=8.2,<10",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.5.1",
    "ruff>=0.9.10",
]

[tool.ruff]
# Replaces the dead [tool.black]/[tool.isort] config: .pre-commit-config.yaml
# runs ruff + ruff-format, and has not run black or isort for some time.
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short -q"
asyncio_mode = "auto"
markers = [
    "security: marks tests as security-related",
    "slow: marks tests as slow-running",
]

[tool.vercel]
entrypoint = "server:app"

[tool.uv]
# The API is an application, not a distributable package: never build it on install.
package = false
