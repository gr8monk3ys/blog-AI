name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  PYTHON_VERSION: "3.12"
  BUN_VERSION: "1.3.10"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend-tests:
    name: Backend Tests (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio pytest-cov

      - name: Run smoke suite (blocking)
        run: |
          pytest tests/test_feature_smoke.py tests/test_routes_health.py -q
        env:
          DEV_MODE: "true"
          OPENAI_API_KEY: "test"

      - name: Enforce critical-route integration coverage >= 85%
        run: |
          pytest \
            tests/test_routes_blog.py \
            tests/test_routes_book.py \
            tests/test_routes_webhooks.py \
            tests/test_routes_payments.py \
            tests/test_routes_usage.py \
            --cov=app.routes.blog \
            --cov=app.routes.book \
            --cov=app.routes.webhooks \
            --cov=app.routes.payments \
            --cov=app.routes.usage \
            --cov-fail-under=85 \
            --cov-report=xml \
            --cov-report=term-missing \
            -q
        env:
          DEV_MODE: "true"
          DEV_API_KEY: "test-key"
          ENVIRONMENT: "development"
          SENTRY_ENVIRONMENT: "development"
          RATE_LIMIT_ENABLED: "false"
          OPENAI_API_KEY: "test"

      # Ratchet floor for routes not yet at 85%. Only ever raise it.
      - name: Enforce broader critical-route coverage floor (ratchet)
        run: |
          pytest \
            tests/test_routes_organizations.py \
            tests/test_routes_sso.py \
            tests/test_routes_export.py \
            tests/test_routes_research.py \
            --cov=app.routes.organizations \
            --cov=app.routes.sso \
            --cov=app.routes.export \
            --cov=app.routes.research \
            --cov-fail-under=50 \
            --cov-report=term-missing \
            -q
        env:
          DEV_MODE: "true"
          DEV_API_KEY: "test-key"
          ENVIRONMENT: "development"
          SENTRY_ENVIRONMENT: "development"
          RATE_LIMIT_ENABLED: "false"
          OPENAI_API_KEY: "test"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: backend-coverage
          path: apps/api/coverage.xml
          retention-days: 14

  backend-regression:
    name: Backend Regression (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run full backend tests
        run: pytest -q
        env:
          DEV_MODE: "true"
          OPENAI_API_KEY: "test"

  frontend-checks:
    name: Frontend Checks (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Unit tests
        run: bun run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: frontend-coverage
          path: apps/web/coverage/
          retention-days: 14

      - name: Build
        run: bun run build

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-checks]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests with coverage gate
        run: bun run test:e2e:coverage

      - name: Upload E2E coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: frontend-e2e-coverage
          path: apps/web/coverage/e2e/
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  schema-smoke:
    name: Schema Smoke (fresh-install migration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blogai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Apply the db/migrations set the way the runner (scripts/migrate_db.mjs)
      # does — in sorted order — using psql. We use psql rather than the runner
      # itself because the runner's @neondatabase/serverless driver talks to Neon
      # over WebSocket and can't reach a plain Postgres service. This still
      # validates the SQL and ordering, which is where the schema risk lives.
      - name: Apply db/migrations to a fresh database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in db/migrations/*.sql; do
            echo "Applying ${f}"
            psql -h localhost -U postgres -d blogai -v ON_ERROR_STOP=1 -q -f "${f}"
          done

      # Fail if the migrated schema is missing any table/column the backend code
      # references. Prevents the schema from silently re-fragmenting.
      - name: Assert code-referenced tables exist
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d blogai -v ON_ERROR_STOP=1 -f scripts/schema_smoke.sql

  backend-db-tests:
    name: Backend DB Tests (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blogai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      # Apply db/migrations so the asyncpg-backed services have their tables.
      - name: Apply db/migrations
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in db/migrations/*.sql; do
            psql -h localhost -U postgres -d blogai -v ON_ERROR_STOP=1 -q -f "${f}"
          done

      # Run the DB-backed integration tests against the real Postgres. These
      # skip in the no-DB backend-tests job; here they exercise the asyncpg
      # service implementations end to end.
      - name: Run DB-backed tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blogai
          DEV_MODE: "true"
          OPENAI_API_KEY: "test"
        run: |
          pytest tests/test_version_service.py tests/test_knowledge_metadata.py tests/test_analytics_neon.py -q
