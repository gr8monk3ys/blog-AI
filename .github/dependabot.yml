# Dependabot retune 2026-09-10: this repo is deployed, so version updates stay on,
# but monthly with a small PR cap. Security updates are a repo setting and unaffected.
version: 2
updates:
- package-ecosystem: pip
  directory: /apps/api
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  # No update-types filter here: requirements are ranges with no lockfile, so
  # Dependabot has no current version to classify an update as minor/patch and
  # a filtered group matches nothing (every update then arrives ungrouped).
  groups:
    development-dependencies:
      dependency-type: development
    production-dependencies:
      dependency-type: production
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /apps/web
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  ignore:
    # TypeScript 7 (the Go-native compiler) ships no JS compiler API, so
    # typescript-eslint (peer: typescript <6) and eslint-config-next cannot
    # load against it. Revisit when typescript-eslint supports it.
    - dependency-name: typescript
      versions: ['>=7']
  groups:
    development-dependencies:
      dependency-type: development
      update-types:
      - minor
      - patch
    production-dependencies:
      dependency-type: production
      update-types:
      - minor
      - patch
    security-updates:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
